      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="logoGrad2" x1="10" y1="10" x2="30" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>
  <!-- Background Sheet -->
  <rect x="3" y="3" width="18" height="18" rx="4" fill="url(#logoGrad1)"/>
  <line x1="3" y1="9" x2="21" y2="9" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="1.5"/>
  <line x1="9" y1="3" x2="9" y2="21" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="1.5"/>
  <line x1="15" y1="3" x2="15" y2="21" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="1.5"/>
  
  <!-- Foreground Canvas Table Sheet -->
  <rect x="11" y="11" width="18" height="18" rx="4" fill="url(#logoGrad2)" stroke="#FFFFFF" stroke-width="1.5"/>
  <line x1="11" y1="17" x2="29" y2="17" stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="1.5"/>
  <line x1="17" y1="11" x2="17" y2="29" stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="1.5"/>
  <line x1="23" y1="11" x2="23" y2="29" stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="1.5"/>
  
  <!-- Infinite Canvas Connect Node -->
  <circle cx="11" cy="11" r="2.5" fill="#F59E0B" stroke="#FFFFFF" stroke-width="1"/>
